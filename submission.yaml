submission:
  title: "Harborline"

  problem_statement: >
    Port operators and shift supervisors often react to congestion only after
    vessel queues and delays have already formed. Changing vessel arrivals,
    berth availability, and port capacity make it difficult to anticipate
    congestion, understand what is driving it, and make timely operational
    decisions.

  solution_summary: >
    PORTPULSE AI combines historical port activity with live vessel intelligence
    to forecast congestion risk 24, 48, and 72 hours ahead. It explains the
    factors behind the forecast and combines predicted congestion pressure with
    current operational conditions to simulate disruptions, optimise schedules,
    and generate an actionable 72-hour operating plan through IBM Bob.

  key_features:
    - "24/48/72-hour AI congestion forecasting with risk scores and risk trajectories"
    - "Real-time vessel and port monitoring using live AIS intelligence"
    - "Congestion intelligence with risk drivers and activity anomalies"
    - "What-if simulation and operational schedule optimisation"
    - "IBM Bob operations assistant for natural-language analysis and 72-hour planning"

  tech_stack:
    languages: ["Python", "TypeScript", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Cloud"]
    databases: ["PostgreSQL"]
    other: ["XGBoost", "scikit-learn", "OR-Tools", "AISStream", "IMF PortWatch", "MCP", "Docker", "GitHub"]

  what_we_are_most_proud_of: >
    PORTPULSE AI connects prediction with operational decision-making instead
    of stopping at a congestion dashboard. The system uses real port activity
    data to forecast congestion pressure ahead of time, exposes the factors
    behind the prediction, and makes that intelligence available to the
    optimisation and IBM Bob workflow.

  known_limitations: >
    The current ML model provides port-level congestion pressure forecasting
    rather than individual berth-level congestion prediction because consistent
    historical berth, crane, and vessel-level operational data is not publicly
    available across all target ports. Some operational resource information
    therefore depends on currently available port data and configured
    operational constraints.

